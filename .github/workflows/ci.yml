name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Chinook (needed by the integration test)
        run: python scripts/download_data.py --dataset chinook

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (everything except live_llm)
        run: pytest -m "not live_llm"

      - name: Eval regression gate (replay from committed cache; no model, no key)
        run: python -m eval.run_eval --split tune --mode replay --gate
