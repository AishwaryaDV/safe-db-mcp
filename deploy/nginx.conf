# Reverse proxy: dashboard on /, API on /api. Drop into /etc/nginx/sites-available/
# and symlink into sites-enabled. Terminate TLS here (certbot) in production.
server {
    listen 80;
    server_name safe-db-mcp.example.com;

    # API — note SSE needs buffering off and a long read timeout for /api/ask streaming.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Next.js dashboard.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
