# Reverse proxy: dashboard on /, API on /api. Drop into /etc/nginx/sites-available/
# and symlink into sites-enabled. Run `certbot --nginx -d safe-db-mcp.example.com` to issue
# the certificate; the ssl_certificate paths below match certbot's default location.

# HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name safe-db-mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name safe-db-mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/safe-db-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safe-db-mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tell browsers to stick to HTTPS for the next two years (submit to the preload list if desired).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # API — note SSE needs buffering off and a long read timeout for /api/ask streaming.
    location /api/ {
        client_max_body_size 16k;       # questions are short; reject large bodies at the edge
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Next.js dashboard.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
